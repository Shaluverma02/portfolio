[build]
  base = "client"
  publish = "dist"
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://your-render-backend-url.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/resumes/*"
  to = "https://your-render-backend-url.onrender.com/resumes/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/skills.json"
  to = "https://your-render-backend-url.onrender.com/skills.json"
  status = 200
  force = true

[[redirects]]
  from = "/projects.json"
  to = "https://your-render-backend-url.onrender.com/projects.json"
  status = 200
  force = true

[[redirects]]
  from = "/experience.json"
  to = "https://your-render-backend-url.onrender.com/experience.json"
  status = 200
  force = true

[[redirects]]
  from = "/certificates.json"
  to = "https://your-render-backend-url.onrender.com/certificates.json"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 302

[[redirects]]
  from = "/admin/"
  to = "/admin/login.html"
  status = 302

[[redirects]]
  from = "/admin/login"
  to = "/admin/login.html"
  status = 302

[[redirects]]
  from = "/admin/dashboard"
  to = "/admin/dashboard.html"
  status = 302
